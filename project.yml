name: Splice
options:
  bundleIdPrefix: com.jonki
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: W2Z92AW32J
targets:
  Splice:
    type: application
    platform: iOS
    sources: [Splice]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonki.splice
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Splice
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 旅行中の写真・動画を読み込んでムービーを作るために使用します。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 書き出したムービーを写真ライブラリに保存するために使用します。
  SpliceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SpliceTests]
    dependencies:
      - target: Splice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SpliceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SpliceUITests]
    dependencies:
      - target: Splice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Splice:
    build:
      targets:
        Splice: all
    test:
      targets: [SpliceTests]
  # App Store 用スクリーンショットの撮影専用。通常の Splice スキームには混ぜない
  Screenshots:
    build:
      targets:
        Splice: all
    test:
      targets: [SpliceUITests]
